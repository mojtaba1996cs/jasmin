kind: wasmer.io/App.v0
name: jasmin
package: .

capabilities:
  database:
    engine: mysql

volumes:
  - name: laravel-public-storage
    mount: /app/public/storage
    
env:
  APP_ENV: production
  APP_DEBUG: "true"
  APP_KEY: "base64:4fxHJvyOhlPrut6SjNGDi45n6KoZvnPix0jiO8ooE6U="
  DB_CONNECTION: mysql
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_DATABASE: ${DB_NAME}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  SESSION_DRIVER: database
  CACHE_DRIVER: file
  FILESYSTEM_DISK: public

jobs:
  - name: run-migrations
    trigger: post-deployment
    action:
      execute:
        command: artisan
        cli_args:
          - "migrate"
          - "--force"
          - "--no-interaction"
